<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Чат по заявці</title>
<link rel="stylesheet" href="style.css" />
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; }
  .chat-screen {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    max-width: 520px;
    margin: 0 auto;
    width: 100%;
  }
  .chat-header {
    padding: 14px 16px;
    border-bottom: 1px solid rgba(0,0,0,0.08);
    background: var(--bg);
  }
  .chat-header h1 { font-size: 17px; margin: 0; }
  .chat-header .sub { font-size: 12px; color: var(--hint); margin-top: 2px; }
  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .bubble {
    max-width: 78%;
    padding: 10px 13px;
    border-radius: 16px;
    font-size: 14.5px;
    line-height: 1.35;
    word-wrap: break-word;
  }
  .bubble .author {
    font-size: 11px;
    font-weight: 700;
    opacity: 0.65;
    margin-bottom: 2px;
  }
  .bubble .time {
    font-size: 10px;
    opacity: 0.55;
    margin-top: 4px;
    text-align: right;
  }
  .bubble.own {
    align-self: flex-end;
    background: var(--button);
    color: var(--button-text);
    border-bottom-right-radius: 4px;
  }
  .bubble.other {
    align-self: flex-start;
    background: var(--secondary-bg);
    color: var(--text);
    border-bottom-left-radius: 4px;
  }
  .chat-input {
    display: flex;
    gap: 8px;
    padding: 10px 12px;
    border-top: 1px solid rgba(0,0,0,0.08);
    background: var(--bg);
  }
  .chat-input textarea {
    flex: 1;
    resize: none;
    border-radius: 18px;
    border: 1px solid rgba(0,0,0,0.12);
    padding: 10px 14px;
    font-size: 14.5px;
    font-family: inherit;
    max-height: 100px;
    background: var(--secondary-bg);
    color: var(--text);
  }
  .chat-input button {
    border: none;
    background: var(--button);
    color: var(--button-text);
    border-radius: 50%;
    width: 42px;
    height: 42px;
    flex-shrink: 0;
    font-size: 18px;
    cursor: pointer;
  }
  .chat-empty { text-align: center; color: var(--hint); padding: 40px 20px; font-size: 14px; }
</style>
</head>
<body>
<div class="chat-screen">
  <div class="chat-header">
    <h1>💬 Чат по заявці <span id="taskIdHeading"></span></h1>
    <div class="sub" id="sub"></div>
  </div>
  <div class="chat-messages" id="messages"></div>
  <div class="chat-input">
    <textarea id="text" rows="1" placeholder="Написати повідомлення…"></textarea>
    <button id="sendBtn">➤</button>
  </div>
</div>

<script>
  const tg = window.Telegram?.WebApp;
  tg?.ready();
  tg?.expand();

  const params = new URLSearchParams(location.search);
  const id = params.get('id');
  const role = params.get('role') === 'admin' ? 'admin' : 'executor';

  async function apiFetch(url, options = {}) {
    const headers = options.headers || {};
    if (tg?.initData) headers['X-Telegram-Init-Data'] = tg.initData;
    const res = await fetch(url, { ...options, headers: { 'Content-Type': 'application/json', ...headers } });
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || 'Помилка запиту');
    return res.json();
  }

  function esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function formatTime(iso) {
    const d = new Date(iso);
    return d.toLocaleTimeString('uk-UA', { hour: '2-digit', minute: '2-digit' });
  }

  let lastCount = -1;
  let authorName = role === 'admin' ? 'Адміністратор' : 'Виконавець';

  function renderMessages(messages) {
    const el = document.getElementById('messages');
    if (!messages.length) {
      el.innerHTML = '<div class="chat-empty">Повідомлень ще немає. Напишіть перше 👋</div>';
      return;
    }
    el.innerHTML = messages
      .map((m) => {
        const own = m.role === role;
        return `<div class="bubble ${own ? 'own' : 'other'}">
          <div class="author">${esc(m.authorName)}</div>
          <div>${esc(m.text)}</div>
          <div class="time">${formatTime(m.createdAt)}</div>
        </div>`;
      })
      .join('');
    el.scrollTop = el.scrollHeight;
  }

  async function loadRequestHeader() {
    try {
      const r = await apiFetch(`/api/requests/${id}`);
      document.getElementById('taskIdHeading').textContent = `№${r.taskId}`;
      document.getElementById('sub').textContent =
        role === 'admin' ? `Виконавець: ${r.executorName || '—'}` : 'Чат з адміністратором';
      authorName = role === 'admin' ? 'Адміністратор' : (r.executorName || 'Виконавець');
    } catch (e) {
      document.getElementById('taskIdHeading').textContent = '';
    }
  }

  async function poll() {
    try {
      const messages = await apiFetch(`/api/requests/${id}/messages`);
      if (messages.length !== lastCount) {
        renderMessages(messages);
        lastCount = messages.length;
      }
    } catch (e) {
      // тихо ігноруємо помилки опитування
    }
  }

  async function send() {
    const textEl = document.getElementById('text');
    const text = textEl.value.trim();
    if (!text) return;
    textEl.value = '';
    textEl.style.height = 'auto';
    try {
      await apiFetch(`/api/requests/${id}/messages`, {
        method: 'POST',
        body: JSON.stringify({ role, text, authorName }),
      });
      await poll();
    } catch (e) {
      alert(e.message || 'Не вдалося надіслати повідомлення');
    }
  }

  document.getElementById('sendBtn').addEventListener('click', send);
  document.getElementById('text').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  });
  document.getElementById('text').addEventListener('input', function () {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 100) + 'px';
  });

  if (!id) {
    document.getElementById('messages').innerHTML = '<div class="chat-empty">Не вказано ID заявки</div>';
  } else {
    loadRequestHeader();
    poll();
    setInterval(poll, 3000);
  }
</script>
</body>
</html>
