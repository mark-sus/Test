<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Заявка</title>
<link rel="stylesheet" href="style.css" />
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  .section-title {
    font-size: 15px;
    font-weight: 700;
    margin: 22px 0 10px;
    color: var(--text);
  }
  .info-item {
    padding: 10px 0;
    border-bottom: 1px solid rgba(0,0,0,0.06);
  }
  .info-item:last-child { border-bottom: none; }
  .info-item-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }
  .info-item .k { font-size: 13px; color: var(--hint); }
  .info-item .v { font-size: 15px; font-weight: 600; margin-top: 2px; }
</style>
</head>
<body>
<div class="screen">
  <h1>Заявка <span id="taskIdHeading"></span></h1>
  <div id="content"></div>
</div>

<div class="toast" id="toast"></div>

<script>
  const tg = window.Telegram?.WebApp;
  tg?.ready();
  tg?.expand();

  const params = new URLSearchParams(location.search);
  const id = params.get('id');
  const role = params.get('role') || 'executor';

  const statusLabels = {
    new: 'Нова',
    pending_review: 'На перевірці',
    rescheduled: 'Перенесена',
    approved: 'Виконана',
  };

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2200);
  }

  async function apiFetch(url, options = {}) {
    const headers = options.headers || {};
    if (tg?.initData) headers['X-Telegram-Init-Data'] = tg.initData;
    const res = await fetch(url, { ...options, headers: { 'Content-Type': 'application/json', ...headers } });
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || 'Помилка запиту');
    return res.json();
  }

  function copyText(text, label) {
    navigator.clipboard?.writeText(text).then(
      () => showToast(`${label} скопійовано`),
      () => showToast('Не вдалося скопіювати')
    );
  }

  function esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function mapUrl(r) {
    if (r.lat && r.lng) return `https://maps.google.com/?q=${r.lat},${r.lng}`;
    const q = encodeURIComponent(`${r.city}, ${r.street}`);
    return `https://maps.google.com/?q=${q}`;
  }

  function copyRow(label, value) {
    if (!value) return '';
    return `<div class="kv">
      <span class="k">${esc(label)}</span>
      <span class="v">${esc(value)} <button class="copy-btn" data-copy="${esc(value)}" data-label="${esc(label)}">Копіювати</button></span>
    </div>`;
  }

  function plainRow(label, value) {
    if (!value) return '';
    return `<div class="kv"><span class="k">${esc(label)}</span><span class="v">${esc(value)}</span></div>`;
  }

  function render(r) {
    document.getElementById('taskIdHeading').textContent = `№${r.taskId}`;

    const address = `${r.city}, ${r.street}${r.apt ? ', кв./під. ' + r.apt : ''}`;
    const timeStr = r.timeFrom ? `з ${r.timeFrom}${r.timeTo ? ' до ' + r.timeTo : ''}` : '';

    let actionsHtml = '';

    if (role === 'admin') {
      if (r.status === 'pending_review') {
        actionsHtml = `
          <button class="btn" id="approveBtn">Прийняти виконання</button>
          <button class="btn secondary" id="rejectBtn">Повернути на доопрацювання</button>`;
      }
    } else {
      if (r.status === 'new') {
        actionsHtml = `
          <button class="btn" id="confirmBtn">Підтвердити виконання</button>
          <button class="btn secondary" id="rescheduleBtn">Перенести на інший день</button>
          <div class="card" id="rescheduleForm" style="display:none; margin-top:10px;">
            <div class="field">
              <label>Нова дата</label>
              <input type="date" id="rescheduleDate" />
            </div>
            <div class="field">
              <label>Коментар (необов'язково)</label>
              <input type="text" id="rescheduleComment" placeholder="Причина перенесення" />
            </div>
            <button class="btn danger" id="rescheduleSubmit">Підтвердити перенесення</button>
          </div>`;
      } else if (r.status === 'rescheduled') {
        actionsHtml = `<div class="card"><div class="kv"><span class="k">Перенесено на</span><span class="v">${esc(r.rescheduleDate)}</span></div>${
          r.rescheduleComment ? `<div class="kv"><span class="k">Коментар</span><span class="v">${esc(r.rescheduleComment)}</span></div>` : ''
        }</div>`;
      }
    }

    const phonesHtml = ['workPhone', 'mobilePhone', 'homePhone']
      .map((key) => {
        const labels = { workPhone: 'Робочий телефон', mobilePhone: 'Мобільний телефон', homePhone: 'Домашній телефон' };
        const val = r[key];
        if (!val) return '';
        return `<div class="card">
          <div class="address-block">
            <div>
              <div class="kv" style="border:none;padding:0 0 4px"><span class="k">${labels[key]}</span></div>
              <div class="v" style="text-align:left">${esc(val)}</div>
            </div>
            <a class="link-btn" href="tel:${esc(val)}">Зателефонувати</a>
          </div>
        </div>`;
      })
      .join('');

    const additionalHtml = (r.additionalInfo || []).length
      ? `<div class="section-title">Додаткова інформація</div>
         <div class="card">
           ${r.additionalInfo
             .map(
               (item) => `
             <div class="info-item">
               <div class="info-item-top">
                 <div>
                   <div class="k">${esc(item.name || 'Без назви')}</div>
                   <div class="v">${esc(item.value)}</div>
                 </div>
                 ${item.copyable ? `<button class="copy-btn" data-copy="${esc(item.value)}" data-label="${esc(item.name || 'Значення')}">Копіювати</button>` : ''}
               </div>
             </div>`
             )
             .join('')}
         </div>`
      : '';

    document.getElementById('content').innerHTML = `
      <div class="card">
        <div class="kv">
          <span class="k">Статус</span>
          <span class="badge ${r.status}">${statusLabels[r.status] || r.status}</span>
        </div>
        ${copyRow('ID завдання', r.taskId)}
        ${timeStr ? `<div class="kv"><span class="k">Час</span><span class="v">${esc(timeStr)}</span></div>` : ''}
        ${copyRow('ID наряду', r.orderId)}
        ${plainRow('Технологія', r.technology)}
        ${copyRow('ID клієнта', r.clientId)}
        ${plainRow("Ім'я клієнта", r.clientName)}
        ${plainRow('Електронна пошта', r.email)}
        ${r.executorName ? `<div class="kv"><span class="k">Виконавець</span><span class="v">${esc(r.executorName)}</span></div>` : ''}
      </div>

      <div class="card">
        <div class="address-block">
          <div>
            <div class="kv" style="border:none;padding:0 0 4px"><span class="k">Локація</span></div>
            <div class="v" style="text-align:left">${esc(address)}</div>
          </div>
          <a class="link-btn" href="${mapUrl(r)}" target="_blank" rel="noopener">Відкрити на мапі</a>
        </div>
      </div>

      ${phonesHtml}

      ${(r.port || r.tkdAddress || r.tkd) ? `
      <div class="section-title">Технічні дані</div>
      <div class="card">
        ${copyRow('Порт', r.port)}
        ${copyRow('Адрес ТКД', r.tkdAddress)}
        ${copyRow('ТКД', r.tkd)}
      </div>` : ''}

      ${additionalHtml}

      ${actionsHtml}
    `;

    document.querySelectorAll('.copy-btn').forEach((btn) => {
      btn.addEventListener('click', () => copyText(btn.dataset.copy, btn.dataset.label));
    });

    if (role === 'admin') {
      document.getElementById('approveBtn')?.addEventListener('click', async () => {
        try {
          await apiFetch(`/api/requests/${r.id}/approve`, { method: 'POST' });
          showToast('Заявку прийнято');
          load();
        } catch (e) { showToast(e.message); }
      });
      document.getElementById('rejectBtn')?.addEventListener('click', async () => {
        try {
          await apiFetch(`/api/requests/${r.id}/reject`, { method: 'POST' });
          showToast('Повернено виконавцю');
          load();
        } catch (e) { showToast(e.message); }
      });
    } else {
      document.getElementById('confirmBtn')?.addEventListener('click', async () => {
        try {
          await apiFetch(`/api/requests/${r.id}/confirm`, { method: 'POST' });
          showToast('Надіслано адміністратору на перевірку ✅');
          load();
        } catch (e) { showToast(e.message); }
      });
      document.getElementById('rescheduleBtn')?.addEventListener('click', () => {
        document.getElementById('rescheduleForm').style.display = 'block';
      });
      document.getElementById('rescheduleSubmit')?.addEventListener('click', async () => {
        const date = document.getElementById('rescheduleDate').value;
        const comment = document.getElementById('rescheduleComment').value;
        if (!date) return showToast('Оберіть дату');
        try {
          await apiFetch(`/api/requests/${r.id}/reschedule`, {
            method: 'POST',
            body: JSON.stringify({ date, comment }),
          });
          showToast('Заявку перенесено, адміністратора повідомлено');
          load();
        } catch (e) { showToast(e.message); }
      });
    }
  }

  async function load() {
    try {
      const r = await apiFetch(`/api/requests/${id}`);
      render(r);
    } catch (err) {
      document.getElementById('content').innerHTML = '<div class="empty">Заявку не знайдено</div>';
    }
  }

  if (!id) {
    document.getElementById('content').innerHTML = '<div class="empty">Не вказано ID заявки</div>';
  } else {
    load();
  }
</script>
</body>
</html>
