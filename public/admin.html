<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Нова заявка</title>
<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  .section-title {
    font-size: 15px;
    font-weight: 700;
    margin: 22px 0 10px;
    color: var(--text);
  }

  .field { position: relative; }
  .field-remove {
    position: absolute;
    top: -2px;
    right: 0;
    border: none;
    background: none;
    color: var(--hint);
    font-size: 16px;
    line-height: 1;
    padding: 4px 6px;
    cursor: pointer;
  }
  .field-remove:active { color: var(--accent-red, #e05252); }

  .hidden-fields-bar {
    display: none;
    flex-wrap: wrap;
    gap: 6px;
    margin: 10px 0 4px;
  }
  .hidden-chip {
    border: 1px dashed rgba(0,0,0,0.25);
    background: none;
    color: var(--link);
    font-size: 12px;
    padding: 5px 10px;
    border-radius: 999px;
    cursor: pointer;
  }

  .tabs {
    display: flex;
    background: var(--secondary-bg);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 12px;
  }
  .tab {
    flex: 1;
    text-align: center;
    padding: 9px 8px;
    border-radius: 9px;
    font-size: 14px;
    font-weight: 700;
    color: var(--hint);
    cursor: pointer;
    user-select: none;
  }
  .tab.active { background: var(--bg); color: var(--text); }

  #map {
    width: 100%;
    height: 220px;
    border-radius: var(--radius);
    margin-bottom: 8px;
  }
  .map-hint { font-size: 12px; color: var(--hint); margin-bottom: 10px; }

  .port-row { display: grid; grid-template-columns: 1.4fr 1fr; gap: 10px; }

  .info-row {
    background: var(--secondary-bg);
    border-radius: var(--radius);
    padding: 12px;
    margin-bottom: 10px;
  }
  .info-row-top { display: flex; gap: 8px; margin-bottom: 8px; }
  .info-row-top input { flex: 1; }
  .info-row-bottom { display: flex; justify-content: space-between; align-items: center; }
  .checkbox-line { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--hint); }
  .checkbox-line input { width: auto; }
  .remove-info-btn { border: none; background: none; color: var(--accent-red, #e05252); font-size: 13px; font-weight: 700; cursor: pointer; }
  .add-info-btn {
    width: 100%; padding: 12px; border-radius: var(--radius);
    border: 1px dashed rgba(0,0,0,0.2); background: none;
    color: var(--link); font-weight: 700; font-size: 14px; cursor: pointer;
  }

  .required-mark { color: var(--accent-red, #e05252); margin-left: 2px; }

  .executor-list { display: flex; flex-direction: column; gap: 8px; }
  .executor-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: var(--radius);
    background: var(--bg);
    border: 2px solid rgba(0,0,0,0.08);
    cursor: pointer;
  }
  .executor-item.selected { border-color: var(--button); background: rgba(36,129,204,0.08); }
  .executor-avatar {
    width: 40px; height: 40px; border-radius: 50%;
    object-fit: cover; background: var(--secondary-bg); flex-shrink: 0;
  }
  .executor-avatar-fallback {
    width: 40px; height: 40px; border-radius: 50%;
    background: var(--secondary-bg); color: var(--hint);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; font-weight: 700; flex-shrink: 0;
  }
  .executor-info { min-width: 0; }
  .executor-name { font-weight: 600; font-size: 14.5px; }
  .executor-username { font-size: 12.5px; color: var(--hint); }
  .executor-pending { font-size: 11px; color: var(--accent-amber, #f0a020); margin-top: 2px; }
  .executor-empty-hint { font-size: 13px; color: var(--hint); padding: 8px 2px; }

  .time-chips { display: flex; flex-wrap: wrap; gap: 8px; margin: -4px 0 14px; }
  .time-chip {
    border: 1px solid rgba(0,0,0,0.12);
    background: var(--secondary-bg);
    color: var(--text);
    font-size: 12.5px;
    font-weight: 600;
    padding: 7px 12px;
    border-radius: 999px;
    cursor: pointer;
    transition: transform 0.1s ease, opacity 0.15s ease;
  }
  .time-chip:active { transform: scale(0.97); opacity: 0.85; }
  .time-chip.active { background: var(--button); color: var(--button-text); border-color: var(--button); }
  .time-chip.urgent { border-color: rgba(224,82,82,0.4); color: var(--accent-red, #e05252); }
  .time-chip.urgent.active { background: var(--accent-red, #e05252); color: #fff; border-color: var(--accent-red, #e05252); }

  .dup-warning {
    display: none;
    font-size: 12.5px;
    line-height: 1.4;
    color: var(--accent-red, #e05252);
    margin-top: 6px;
  }
  .dup-warning.show { display: block; }
  .dup-warning a { color: inherit; text-decoration: underline; }
</style>
</head>
<body>
<div class="screen">
  <div class="top-bar" id="topBar"></div>
  <h1>Нова заявка</h1>

  <div class="tabs" id="typeTabs">
    <div class="tab active" data-type="FTTB">🏢 FTTB</div>
    <div class="tab" data-type="PON">📡 PON</div>
  </div>

  <div class="hidden-fields-bar" id="hiddenFieldsBar"></div>

  <form id="form">
    <div class="field" data-label="ID завдання" data-locked="true">
      <label>ID завдання<span class="required-mark">*</span></label>
      <input type="text" id="taskId" placeholder="1234567890" required />
      <div class="dup-warning" id="taskIdWarning"></div>
    </div>

    <div class="row-2">
      <div class="field" data-label="Час з">
        <label>Час з</label>
        <input type="time" id="timeFrom" value="11:00" />
      </div>
      <div class="field" data-label="Час до">
        <label>Час до</label>
        <input type="time" id="timeTo" />
      </div>
    </div>

    <div class="time-chips" id="timeChips">
      <button type="button" class="time-chip" data-slot="morning">Перша половина дня (9:00–13:00)</button>
      <button type="button" class="time-chip" data-slot="afternoon">Друга половина дня (13:00–18:00)</button>
      <button type="button" class="time-chip urgent" data-slot="urgent">⚡ Терміново</button>
    </div>

    <div class="field" data-label="ID наряда" data-locked="true">
      <label>ID наряда<span class="required-mark">*</span></label>
      <input type="text" id="orderId" placeholder="123123123" required />
      <div class="dup-warning" id="orderIdWarning"></div>
    </div>

    <div class="field" data-label="Технологія">
      <label>Технологія</label>
      <select id="technology">
        <option value="Абонентська аварія">Абонентська аварія</option>
        <option value="Абонентське Підключення">Абонентське Підключення</option>
        <option value="Послуга Майстер">Послуга Майстер</option>
        <option value="__custom">Інше…</option>
      </select>
      <input type="text" id="technologyCustom" placeholder="Вкажіть технологію" style="display:none; margin-top:8px;" />
    </div>

    <div class="field" data-label="ID клієнта">
      <label id="clientIdLabelText">ID клієнта</label>
      <input type="text" id="clientId" placeholder="0000000000" />
    </div>

    <div class="section-title fttb-only" id="clientSectionTitle">Клієнт</div>

    <div class="fttb-only" id="clientNameEmailBlock">
      <div class="field" data-label="Ім'я">
        <label>Ім'я</label>
        <input type="text" id="clientName" placeholder="Ім'я Фамілія" />
      </div>

      <div class="field" data-label="Електронна пошта">
        <label>Електронна пошта</label>
        <input type="email" id="email" placeholder="client@example.com" />
      </div>
    </div>

    <div class="row-2 fttb-only" id="homeMobilePhoneRow">
      <div class="field" data-label="Домашній телефон">
        <label>Домашній телефон</label>
        <input type="tel" id="homePhone" placeholder="380000000000" />
      </div>
      <div class="field" data-label="Мобільний телефон">
        <label>Мобільний телефон</label>
        <input type="tel" id="mobilePhone" placeholder="380000000000" />
      </div>
    </div>

    <div class="field" data-label="Робочий телефон">
      <label id="phoneLabelText">Робочий телефон</label>
      <input type="tel" id="phone" placeholder="+380000000000" />
    </div>

    <div class="section-title">Локація</div>

    <div class="tabs">
      <div class="tab active" data-loctab="map" id="locTabMap">На карті</div>
      <div class="tab" data-loctab="manual" id="locTabManual">Вручну</div>
    </div>

    <div id="locMapBlock">
      <div id="map"></div>
      <div class="map-hint">Торкніться карти, щоб позначити адресу — поля нижче заповняться автоматично (їх можна відредагувати)</div>
      <button type="button" class="btn secondary" id="locateBtn">📍 Моє місцезнаходження</button>
    </div>

    <div class="field" data-label="Місто" data-locked="true" style="margin-top:14px;">
      <label>Місто<span class="required-mark">*</span></label>
      <input type="text" id="city" value="Рівне" required />
    </div>

    <div class="row-2">
      <div class="field" data-label="Вулиця, будинок" data-locked="true">
        <label>Вулиця, будинок<span class="required-mark">*</span></label>
        <input type="text" id="street" placeholder="Вулиця 10" required />
      </div>
      <div class="field" data-label="Кв. / під'їзд">
        <label>Кв. / під'їзд</label>
        <input type="text" id="apt" placeholder="1" />
      </div>
    </div>

    <button type="button" class="btn secondary" id="geocodeBtn" style="margin-top:2px;">🔍 Знайти на мапі за адресою</button>

    <div class="section-title fttb-only" id="techSectionTitle">Технічні дані</div>

    <div class="fttb-only" id="techDataBlock">
      <div class="field" data-label="Порт">
        <label>Порт</label>
        <div class="port-row">
          <select id="portType">
            <option value="">— не вказано —</option>
            <option value="Ethernet">Ethernet</option>
            <option value="Gigabit Ethernet">Gigabit Ethernet</option>
          </select>
          <select id="portNumber">
            <option value="">№</option>
          </select>
        </div>
      </div>

      <div class="field" data-label="Адрес ТКД">
        <label>Адрес ТКД</label>
        <input type="text" id="tkdAddress" placeholder="............" />
      </div>

      <div class="field" data-label="ТКД">
        <label>ТКД</label>
        <input type="text" id="tkd" placeholder="MDU_AAA00000_0000_0" />
      </div>
    </div>

    <div class="section-title">Додаткова інформація</div>
    <div id="additionalInfoList"></div>
    <button type="button" class="add-info-btn" id="addInfoBtn">+ Додаткова інформація</button>

    <div class="section-title">Виконавець</div>
    <div class="field" data-label="Пошук виконавця" data-locked="true">
      <input type="text" id="executorSearch" placeholder="🔍 Пошук виконавця за іменем" />
    </div>
    <div class="field" data-label="Виконавець" data-locked="true">
      <label>Виконавець<span class="required-mark">*</span></label>
      <div class="executor-list" id="executorList">
        <div class="executor-empty-hint">Завантаження…</div>
      </div>
      <input type="hidden" id="executorId" />
    </div>

    <button type="submit" class="btn">Створити заявку</button>
  </form>
</div>

<div class="toast" id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="common.js"></script>
<script>
  const tg = window.Telegram?.WebApp;
  tg?.ready();
  tg?.expand();

  const topBar = document.getElementById('topBar');
  topBar.appendChild(AppCommon.renderBackButton('requests.html?role=admin'));
  AppCommon.initTelegramBackButton('requests.html?role=admin');

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2400);
  }

  async function apiFetch(url, options = {}) {
    const headers = options.headers || {};
    if (tg?.initData) headers['X-Telegram-Init-Data'] = tg.initData;
    const res = await fetch(url, { ...options, headers: { 'Content-Type': 'application/json', ...headers } });
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || 'Помилка запиту');
    return res.json();
  }

  AppCommon.renderNotifToggle(topBar, apiFetch);

  // ---------- Маска телефону +380 (XX) XXX-XX-XX ----------
  ['homePhone', 'mobilePhone', 'phone'].forEach((id) => AppCommon.attachPhoneMask(document.getElementById(id)));

  // ---------- Швидкий вибір часового слоту ----------
  const timeChips = document.querySelectorAll('#timeChips .time-chip');
  const timeFromInput = document.getElementById('timeFrom');
  const timeToInput = document.getElementById('timeTo');

  function pad2(n) { return String(n).padStart(2, '0'); }

  timeChips.forEach((chip) => {
    chip.addEventListener('click', () => {
      const slot = chip.dataset.slot;
      if (slot === 'morning') {
        timeFromInput.value = '09:00';
        timeToInput.value = '13:00';
      } else if (slot === 'afternoon') {
        timeFromInput.value = '13:00';
        timeToInput.value = '18:00';
      } else if (slot === 'urgent') {
        const now = new Date();
        const end = new Date(now.getTime() + 60 * 60 * 1000);
        timeFromInput.value = `${pad2(now.getHours())}:${pad2(now.getMinutes())}`;
        timeToInput.value = `${pad2(end.getHours())}:${pad2(end.getMinutes())}`;
      }
      timeChips.forEach((c) => c.classList.remove('active'));
      chip.classList.add('active');
    });
  });

  // Якщо користувач вручну змінює час — знімаємо виділення з чипів, щоб не вводити в оману
  [timeFromInput, timeToInput].forEach((input) => {
    input.addEventListener('input', () => timeChips.forEach((c) => c.classList.remove('active')));
  });

  // ---------- Перевірка дублікатів ID завдання / ID наряда ----------
  const taskIdInput = document.getElementById('taskId');
  const orderIdInput = document.getElementById('orderId');
  const taskIdWarning = document.getElementById('taskIdWarning');
  const orderIdWarning = document.getElementById('orderIdWarning');
  let dupTimer = null;

  function hideWarning(el) {
    el.classList.remove('show');
    el.innerHTML = '';
  }

  function showWarning(el, label, value, info) {
    el.innerHTML = `⚠️ Заявка з ${esc(label)} «${esc(value)}» вже існує — <a href="request.html?id=${encodeURIComponent(info.id)}&role=admin" target="_blank" rel="noopener">переглянути</a>`;
    el.classList.add('show');
  }

  async function checkDuplicates() {
    const taskId = taskIdInput.value.trim();
    const orderId = orderIdInput.value.trim();
    hideWarning(taskIdWarning);
    hideWarning(orderIdWarning);
    if (!taskId && !orderId) return;
    const params = new URLSearchParams();
    if (taskId) params.set('taskId', taskId);
    if (orderId) params.set('orderId', orderId);
    try {
      const result = await apiFetch(`/api/requests/check-duplicate?${params.toString()}`);
      if (result.taskId) showWarning(taskIdWarning, 'ID завдання', taskId, result.taskId);
      if (result.orderId) showWarning(orderIdWarning, 'ID наряда', orderId, result.orderId);
    } catch (e) {
      // перевірка дублікатів не критична — мовчки ігноруємо помилку мережі
    }
  }

  function scheduleDupCheck() {
    clearTimeout(dupTimer);
    dupTimer = setTimeout(checkDuplicates, 500);
  }

  taskIdInput.addEventListener('input', scheduleDupCheck);
  orderIdInput.addEventListener('input', scheduleDupCheck);

  // ---------- Прибрати поле (зробити необов'язковим / не заповнювати) ----------
  const hiddenBar = document.getElementById('hiddenFieldsBar');

  function updateHiddenBar() {
    hiddenBar.style.display = hiddenBar.children.length ? 'flex' : 'none';
  }

  function makeRemovable(fieldEl) {
    const label = fieldEl.dataset.label || 'Поле';
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'field-remove';
    btn.title = `Прибрати «${label}»`;
    btn.textContent = '✕';
    btn.addEventListener('click', () => {
      fieldEl.style.display = 'none';
      const chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'hidden-chip';
      chip.textContent = `+ ${label}`;
      chip.addEventListener('click', () => {
        fieldEl.style.display = '';
        chip.remove();
        updateHiddenBar();
      });
      hiddenBar.appendChild(chip);
      updateHiddenBar();
    });
    fieldEl.appendChild(btn);
  }

  document.querySelectorAll('.field[data-label]:not([data-locked])').forEach(makeRemovable);

  // Перевіряємо реальну видимість поля (враховує й приховані батьківські блоки .fttb-only)
  function fieldVisible(el) {
    return el.offsetParent !== null;
  }

  // ---------- Технологія: "Інше" ----------
  const techSelect = document.getElementById('technology');
  const techCustom = document.getElementById('technologyCustom');
  techSelect.addEventListener('change', () => {
    techCustom.style.display = techSelect.value === '__custom' ? 'block' : 'none';
  });

  function getTechnology() {
    if (!fieldVisible(techSelect)) return '';
    return techSelect.value === '__custom' ? techCustom.value.trim() : techSelect.value;
  }

  // ---------- Тип підключення: FTTB / PON ----------
  const typeTabs = document.querySelectorAll('#typeTabs .tab');
  let connectionType = 'FTTB';

  const TECH_OPTIONS = {
    FTTB: [
      ['Абонентська аварія', 'Абонентська аварія'],
      ['Абонентське Підключення', 'Абонентське Підключення'],
      ['Послуга Майстер', 'Послуга Майстер'],
      ['__custom', 'Інше…'],
    ],
    PON: [
      ['Абонентське підключення', 'Абонентське підключення'],
      ['Абонентська Аварія', 'Абонентська Аварія'],
      ['__custom', 'Інше…'],
    ],
  };

  function renderTechOptions(type) {
    const prevValue = techSelect.value;
    techSelect.innerHTML = TECH_OPTIONS[type]
      .map(([value, label]) => `<option value="${value}">${label}</option>`)
      .join('');
    const stillExists = [...techSelect.options].some((o) => o.value === prevValue);
    techSelect.value = stillExists ? prevValue : techSelect.options[0].value;
    techCustom.style.display = techSelect.value === '__custom' ? 'block' : 'none';
  }

  function setConnectionType(type) {
    connectionType = type;
    typeTabs.forEach((t) => t.classList.toggle('active', t.dataset.type === type));

    document.querySelectorAll('.fttb-only').forEach((el) => {
      el.style.display = type === 'FTTB' ? '' : 'none';
    });

    renderTechOptions(type);

    const clientIdInput = document.getElementById('clientId');
    if (type === 'PON') {
      document.getElementById('clientIdLabelText').textContent = 'Номер клієнта';
      clientIdInput.placeholder = '123456789012';
      document.getElementById('phoneLabelText').textContent = 'Номер телефону';
    } else {
      document.getElementById('clientIdLabelText').textContent = 'ID клієнта';
      clientIdInput.placeholder = '0000000000';
      document.getElementById('phoneLabelText').textContent = 'Робочий телефон';
    }
  }

  typeTabs.forEach((tab) => {
    tab.addEventListener('click', () => setConnectionType(tab.dataset.type));
  });

  setConnectionType('FTTB');

  // ---------- Порт: тип + номер 1-24 ----------
  const portNumberSelect = document.getElementById('portNumber');
  for (let i = 1; i <= 24; i++) {
    const opt = document.createElement('option');
    opt.value = i;
    opt.textContent = i;
    portNumberSelect.appendChild(opt);
  }

  function getPort() {
    if (!fieldVisible(document.getElementById('portType'))) return '';
    const type = document.getElementById('portType').value;
    const num = portNumberSelect.value;
    return type && num ? `${type}.${num}` : '';
  }

  // ---------- Локація: карта / вручну ----------
  const locMapBlock = document.getElementById('locMapBlock');
  document.getElementById('locTabMap').addEventListener('click', () => setLocTab('map'));
  document.getElementById('locTabManual').addEventListener('click', () => setLocTab('manual'));

  function setLocTab(tab) {
    document.getElementById('locTabMap').classList.toggle('active', tab === 'map');
    document.getElementById('locTabManual').classList.toggle('active', tab === 'manual');
    locMapBlock.style.display = tab === 'map' ? 'block' : 'none';
    if (tab === 'map') setTimeout(() => map.invalidateSize(), 200);
  }

  const DEFAULT_CENTER = [50.5904, 27.6383]; // Звягель (Новоград-Волинський)
  let marker = null;
  const map = L.map('map').setView(DEFAULT_CENTER, 13);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap',
    maxZoom: 19,
  }).addTo(map);

  function setMarker(lat, lng) {
    if (marker) marker.setLatLng([lat, lng]);
    else marker = L.marker([lat, lng], { draggable: true }).addTo(map);
    marker.on('dragend', () => {
      const p = marker.getLatLng();
      document.getElementById('lat').value = p.lat;
      document.getElementById('lng').value = p.lng;
      reverseGeocode(p.lat, p.lng);
    });
    document.getElementById('lat').value = lat;
    document.getElementById('lng').value = lng;
  }

  async function reverseGeocode(lat, lng) {
    try {
      const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}&accept-language=uk`);
      const data = await res.json();
      const a = data.address || {};
      const cityVal = a.city || a.town || a.village || a.municipality || '';
      const streetVal = [a.road, a.house_number].filter(Boolean).join(' ');
      if (cityVal) document.getElementById('city').value = cityVal;
      if (streetVal) document.getElementById('street').value = streetVal;
    } catch (e) {
      // геокодування не критичне — просто залишаємо поля як є
    }
  }

  async function geocodeAddress() {
    const city = document.getElementById('city').value.trim();
    const street = document.getElementById('street').value.trim();
    const query = [city, street].filter(Boolean).join(', ');
    if (!query) return showToast('Вкажіть місто та вулицю для пошуку');
    try {
      const res = await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&q=${encodeURIComponent(query)}&limit=1`);
      const results = await res.json();
      if (!results.length) return showToast('Адресу не знайдено на мапі');
      const { lat, lon } = results[0];
      setLocTab('map');
      setMarker(parseFloat(lat), parseFloat(lon));
      map.setView([lat, lon], 17);
    } catch (e) {
      showToast('Не вдалося знайти адресу');
    }
  }

  document.getElementById('geocodeBtn').addEventListener('click', geocodeAddress);

  map.on('click', (e) => {
    setMarker(e.latlng.lat, e.latlng.lng);
    map.panTo(e.latlng);
    reverseGeocode(e.latlng.lat, e.latlng.lng);
  });

  document.getElementById('locateBtn').addEventListener('click', () => {
    if (!navigator.geolocation) return showToast('Геолокація недоступна в цьому браузері');
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        const { latitude, longitude } = pos.coords;
        setMarker(latitude, longitude);
        map.setView([latitude, longitude], 16);
        reverseGeocode(latitude, longitude);
      },
      () => showToast('Не вдалося визначити місцезнаходження')
    );
  });

  // приховані поля для координат
  const latInput = document.createElement('input');
  latInput.type = 'hidden';
  latInput.id = 'lat';
  const lngInput = document.createElement('input');
  lngInput.type = 'hidden';
  lngInput.id = 'lng';
  document.getElementById('form').appendChild(latInput);
  document.getElementById('form').appendChild(lngInput);

  setTimeout(() => map.invalidateSize(), 300);

  // ---------- Додаткова інформація ----------
  let infoCounter = 0;
  function addInfoRow() {
    infoCounter += 1;
    const rowId = `info-${infoCounter}`;
    const wrap = document.createElement('div');
    wrap.className = 'info-row';
    wrap.id = rowId;
    wrap.innerHTML = `
      <div class="info-row-top">
        <input type="text" placeholder="Назва" class="info-name" />
        <input type="text" placeholder="Інформація" class="info-value" />
      </div>
      <div class="info-row-bottom">
        <label class="checkbox-line">
          <input type="checkbox" class="info-copyable" checked />
          Дозволити копіювання
        </label>
        <button type="button" class="remove-info-btn" data-target="${rowId}">Видалити</button>
      </div>
    `;
    document.getElementById('additionalInfoList').appendChild(wrap);
    wrap.querySelector('.remove-info-btn').addEventListener('click', () => wrap.remove());
  }

  document.getElementById('addInfoBtn').addEventListener('click', addInfoRow);

  function collectAdditionalInfo() {
    return [...document.querySelectorAll('#additionalInfoList .info-row')]
      .map((row) => ({
        name: row.querySelector('.info-name').value.trim(),
        value: row.querySelector('.info-value').value.trim(),
        copyable: row.querySelector('.info-copyable').checked,
      }))
      .filter((item) => item.name || item.value);
  }

  // ---------- Виконавці ----------
  function esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  let allExecutors = [];

  function renderExecutorList(list) {
    const listEl = document.getElementById('executorList');
    if (!allExecutors.length) {
      listEl.innerHTML = '<div class="executor-empty-hint">Немає доданих виконавців. Додайте через бота кнопкою «➕ Додати виконавця».</div>';
      return;
    }
    if (!list.length) {
      listEl.innerHTML = '<div class="executor-empty-hint">Нікого не знайдено</div>';
      return;
    }
    const selectedId = document.getElementById('executorId').value;
    listEl.innerHTML = list
      .map((e) => {
        const initial = (e.firstName || e.username || '?').trim().charAt(0).toUpperCase();
        return `
      <div class="executor-item${e.id === selectedId ? ' selected' : ''}" data-id="${e.id}">
        <img class="executor-avatar" src="/api/executors/${e.id}/avatar" alt=""
             onerror="this.outerHTML='<div class=&quot;executor-avatar-fallback&quot;>${initial}</div>'" />
        <div class="executor-info">
          <div class="executor-name">${esc(e.firstName)} ${esc(e.lastName)}</div>
          ${e.username ? `<div class="executor-username">@${esc(e.username)}</div>` : ''}
          ${e.pending ? '<div class="executor-pending">⏳ ще не запускав бота</div>' : ''}
        </div>
      </div>`;
      })
      .join('');
    listEl.querySelectorAll('.executor-item').forEach((item) => {
      item.addEventListener('click', () => {
        listEl.querySelectorAll('.executor-item').forEach((i) => i.classList.remove('selected'));
        item.classList.add('selected');
        document.getElementById('executorId').value = item.dataset.id;
      });
    });
  }

  async function loadExecutors() {
    const listEl = document.getElementById('executorList');
    try {
      allExecutors = await apiFetch('/api/executors');
      renderExecutorList(allExecutors);
    } catch (err) {
      listEl.innerHTML = '<div class="executor-empty-hint">Не вдалося завантажити виконавців</div>';
    }
  }
  loadExecutors();

  document.getElementById('executorSearch').addEventListener('input', (e) => {
    const q = e.target.value.trim().toLowerCase();
    const filtered = !q
      ? allExecutors
      : allExecutors.filter((ex) => {
          const name = [ex.firstName, ex.lastName].filter(Boolean).join(' ').toLowerCase();
          return name.includes(q) || (ex.username || '').toLowerCase().includes(q);
        });
    renderExecutorList(filtered);
  });

  // ---------- Допоміжне: значення поля лише якщо воно видиме ----------
  function val(id) {
    const el = document.getElementById(id);
    if (!fieldVisible(el)) return '';
    return el.value.trim();
  }

  // ---------- Сабміт ----------
  document.getElementById('form').addEventListener('submit', async (e) => {
    e.preventDefault();

    if (!val('taskId')) return showToast('Вкажіть ID завдання');
    if (!val('orderId')) return showToast('Вкажіть ID наряда');
    if (!val('city') || !val('street')) return showToast('Вкажіть Місто та Вулицю');
    if (!document.getElementById('executorId').value) return showToast('Оберіть виконавця');

    if (taskIdWarning.classList.contains('show') || orderIdWarning.classList.contains('show')) {
      if (!confirm('Схоже, заявка з таким ID вже існує в системі. Все одно створити нову?')) return;
    }

    const payload = {
      taskId: val('taskId'),
      timeFrom: val('timeFrom'),
      timeTo: val('timeTo'),
      orderId: val('orderId'),
      connectionType,
      technology: getTechnology(),
      clientId: val('clientId'),
      clientName: val('clientName'),
      email: val('email'),
      homePhone: val('homePhone'),
      mobilePhone: val('mobilePhone'),
      phone: val('phone'),
      city: val('city'),
      street: val('street'),
      apt: val('apt'),
      lat: document.getElementById('lat').value || null,
      lng: document.getElementById('lng').value || null,
      port: getPort(),
      tkdAddress: val('tkdAddress'),
      tkd: val('tkd'),
      additionalInfo: collectAdditionalInfo(),
      executorId: document.getElementById('executorId').value,
    };

    try {
      await apiFetch('/api/requests', { method: 'POST', body: JSON.stringify(payload) });
      showToast('Заявку створено та надіслано виконавцю ✅');
      document.getElementById('form').reset();
      document.getElementById('city').value = 'Звягель';
      document.getElementById('timeFrom').value = '11:00';
      document.getElementById('additionalInfoList').innerHTML = '';
      renderTechOptions(connectionType);
      if (marker) { map.removeLayer(marker); marker = null; }
      document.getElementById('lat').value = '';
      document.getElementById('lng').value = '';
      document.getElementById('executorId').value = '';
      document.getElementById('executorSearch').value = '';
      renderExecutorList(allExecutors);
      timeChips.forEach((c) => c.classList.remove('active'));
      hideWarning(taskIdWarning);
      hideWarning(orderIdWarning);
    } catch (err) {
      showToast(err.message || 'Помилка створення заявки');
    }
  });
</script>
</body>
</html>
