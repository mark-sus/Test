<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Нова заявка</title>
<link rel="stylesheet" href="style.css" />
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<div class="screen">
  <h1>Нова заявка</h1>

  <form id="form">
    <div class="field">
      <label>ID завдання</label>
      <input type="text" id="taskId" placeholder="2261399736" required />
    </div>

    <div class="row-2">
      <div class="field">
        <label>Час з</label>
        <input type="time" id="timeFrom" value="15:00" required />
      </div>
      <div class="field">
        <label>Час до</label>
        <input type="time" id="timeTo" value="16:00" required />
      </div>
    </div>

    <div class="field">
      <label>ID наряда</label>
      <input type="text" id="orderId" placeholder="1261357263" required />
    </div>

    <div class="field">
      <label>Технологія / Послуга</label>
      <input type="text" id="technology" placeholder="Послуга Майстер" required />
    </div>

    <div class="field">
      <label>Робочий телефон</label>
      <input type="tel" id="phone" placeholder="380967165334" required />
    </div>

    <div class="field">
      <label>Місто</label>
      <input type="text" id="city" value="Звягель" required />
    </div>

    <div class="row-2">
      <div class="field">
        <label>Вулиця, будинок</label>
        <input type="text" id="street" placeholder="Європейська 14" required />
      </div>
      <div class="field">
        <label>Кв. / офіс</label>
        <input type="text" id="apt" placeholder="20" />
      </div>
    </div>

    <div class="field">
      <label>ID клієнта</label>
      <input type="text" id="clientId" placeholder="380967165334" required />
    </div>

    <div class="field">
      <label>Виконавець</label>
      <select id="executorId" required>
        <option value="" disabled selected>Оберіть виконавця…</option>
      </select>
    </div>

    <button type="submit" class="btn">Створити заявку</button>
  </form>
</div>

<div class="toast" id="toast"></div>

<script>
  const tg = window.Telegram?.WebApp;
  tg?.ready();
  tg?.expand();

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2200);
  }

  async function apiFetch(url, options = {}) {
    const headers = options.headers || {};
    if (tg?.initData) headers['X-Telegram-Init-Data'] = tg.initData;
    const res = await fetch(url, { ...options, headers: { 'Content-Type': 'application/json', ...headers } });
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || 'Помилка запиту');
    return res.json();
  }

  async function loadExecutors() {
    const select = document.getElementById('executorId');
    try {
      const executors = await apiFetch('/api/executors');
      if (!executors.length) {
        const opt = document.createElement('option');
        opt.textContent = 'Немає зареєстрованих виконавців';
        opt.disabled = true;
        select.appendChild(opt);
        return;
      }
      executors.forEach((e) => {
        const opt = document.createElement('option');
        opt.value = e.id;
        opt.textContent = e.name;
        select.appendChild(opt);
      });
    } catch (err) {
      showToast('Не вдалося завантажити виконавців');
    }
  }

  loadExecutors();

  document.getElementById('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const payload = {
      taskId: document.getElementById('taskId').value.trim(),
      timeFrom: document.getElementById('timeFrom').value,
      timeTo: document.getElementById('timeTo').value,
      orderId: document.getElementById('orderId').value.trim(),
      technology: document.getElementById('technology').value.trim(),
      phone: document.getElementById('phone').value.trim(),
      city: document.getElementById('city').value.trim(),
      street: document.getElementById('street').value.trim(),
      apt: document.getElementById('apt').value.trim(),
      clientId: document.getElementById('clientId').value.trim(),
      executorId: document.getElementById('executorId').value,
    };

    try {
      tg?.MainButton?.showProgress?.();
      await apiFetch('/api/requests', { method: 'POST', body: JSON.stringify(payload) });
      showToast('Заявку створено та надіслано виконавцю ✅');
      document.getElementById('form').reset();
      document.getElementById('city').value = 'Звягель';
      document.getElementById('timeFrom').value = '15:00';
      document.getElementById('timeTo').value = '16:00';
    } catch (err) {
      showToast(err.message || 'Помилка створення заявки');
    } finally {
      tg?.MainButton?.hideProgress?.();
    }
  });
</script>
</body>
</html>
